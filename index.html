<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>MyNotes</title>
  <meta name="description" content="A free, open source handwriting notes app.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MyNotes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved appearance before first paint to avoid a flash.
    try {
      var s = JSON.parse(localStorage.getItem('mynotes-settings') || '{}');
      if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
    } catch (e) {}
  </script>
</head>
<body>
  <!-- Library -->
  <section id="library-view" class="view">
    <header class="topbar lib-top">
      <button id="folder-back-btn" class="icon-btn" type="button" aria-label="Back" hidden></button>
      <nav id="breadcrumb" class="breadcrumb" aria-label="Folder path"></nav>
      <button id="select-btn" class="text-btn" type="button">Select</button>
      <button id="trash-btn" class="icon-btn" type="button" aria-label="Trash"></button>
      <button id="settings-btn" class="icon-btn" type="button" aria-label="Settings"></button>
      <button id="new-btn" class="btn btn-primary btn-new" type="button" aria-label="New"></button>
    </header>
    <main class="library">
      <div id="empty-state" class="empty" hidden>
        <div class="empty-icon" aria-hidden="true"></div>
        <h2 id="empty-title">No notebooks yet</h2>
        <p id="empty-text">Create a notebook or a folder to get started.</p>
        <button id="empty-create-btn" class="btn btn-primary" type="button">Create a notebook</button>
      </div>
      <ul id="item-grid" class="grid" aria-label="Folders and notebooks"></ul>
    </main>
    <div id="select-bar" class="select-bar" hidden>
      <span id="select-count" class="select-count">0 selected</span>
      <button id="select-all-btn" class="text-btn" type="button">Select all</button>
      <span class="select-spacer"></span>
      <button id="select-move-btn" class="bar-action" type="button" disabled></button>
      <button id="select-trash-btn" class="bar-action danger" type="button" disabled></button>
      <button id="select-done-btn" class="text-btn strong" type="button">Done</button>
    </div>
    <footer class="statusbar">
      <span id="storage-status"></span>
      <span id="version-label"></span>
    </footer>
  </section>

  <!-- Notebook editor -->
  <section id="notebook-view" class="view mode-read" hidden>
    <header class="topbar editor-top">
      <button id="back-btn" class="icon-btn" type="button" aria-label="Back to library"></button>
      <button id="thumbs-btn" class="icon-btn" type="button" aria-label="Page overview"></button>
      <button id="search-btn" class="icon-btn" type="button" aria-label="Search in notebook"></button>
      <button id="notebook-title" class="title-btn" type="button" aria-label="Rename notebook"></button>
      <button id="page-indicator" class="page-indicator" type="button" aria-label="Show pages"></button>
      <button id="undo-btn" class="icon-btn edit-only" type="button" aria-label="Undo"></button>
      <button id="redo-btn" class="icon-btn edit-only" type="button" aria-label="Redo"></button>
      <button id="mode-btn" class="mode-btn" type="button" aria-label="Switch between reading and editing"></button>
      <button id="present-btn" class="icon-btn" type="button" aria-label="Presentation mode"></button>
      <button id="editor-more-btn" class="icon-btn" type="button" aria-label="Notebook options"></button>
    </header>
    <div id="toolbar" class="toolbar edit-only" role="toolbar" aria-label="Writing tools"></div>
    <div id="stage" class="stage">
      <aside id="thumbs" class="thumbs" aria-label="Pages" hidden></aside>
      <main id="pages" class="pages"><div id="pages-inner" class="pages-inner"></div></main>
      <canvas id="ink-wet" class="ink-overlay" aria-hidden="true"></canvas>
      <canvas id="ink-tail" class="ink-overlay" aria-hidden="true"></canvas>
      <div id="search-panel" class="search-panel" hidden>
        <input id="search-input" type="search" placeholder="Search this notebook" autocomplete="off" enterkeyhint="search">
        <div id="search-results" class="search-results"></div>
      </div>
      <div id="pull-hint" class="pull-hint" hidden><span class="pull-ring"></span><span class="pull-text">Pull up to add a page</span></div>
      <div id="zoom-badge" class="zoom-badge" hidden></div>
      <div id="present-bar" class="present-bar" role="toolbar" aria-label="Presentation tools" hidden></div>
    </div>
    <div id="pen-popover" class="popover" hidden></div>
    <input id="image-input" type="file" accept="image/*" class="visually-hidden" tabindex="-1" aria-hidden="true">
  </section>

  <!-- Create / edit notebook -->
  <dialog id="notebook-dialog" class="sheet">
    <form id="notebook-form" method="dialog">
      <h2 id="notebook-dialog-title">New notebook</h2>
      <label class="field">
        <span>Name</span>
        <input id="nb-title" name="title" type="text" maxlength="80" placeholder="Untitled" autocomplete="off">
      </label>
      <fieldset class="field">
        <legend>Cover</legend>
        <div id="cover-options" class="swatches"></div>
      </fieldset>
      <fieldset class="field" id="paper-fieldset">
        <legend>Paper</legend>
        <div id="paper-options" class="papers"></div>
      </fieldset>
      <div class="actions">
        <button type="button" class="btn btn-ghost" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary" id="nb-submit">Create</button>
      </div>
    </form>
  </dialog>

  <!-- Settings -->
  <dialog id="settings-dialog" class="sheet">
    <h2>Settings</h2>
    <div class="field">
      <span>Appearance</span>
      <div class="segmented" id="theme-options" role="radiogroup" aria-label="Appearance">
        <button type="button" data-theme-value="system" role="radio">System</button>
        <button type="button" data-theme-value="light" role="radio">Light</button>
        <button type="button" data-theme-value="dark" role="radio">Dark</button>
      </div>
    </div>
    <div class="field">
      <span>Pages</span>
      <div class="segmented" id="dark-pages-options" role="radiogroup" aria-label="Page colour">
        <button type="button" data-dark-pages="off" role="radio">Light</button>
        <button type="button" data-dark-pages="on" role="radio">Dark</button>
        <button type="button" data-dark-pages="auto" role="radio">Match app</button>
      </div>
    </div>
    <div class="field">
      <span>Open notebooks in</span>
      <div class="segmented segmented-2" id="open-mode-options" role="radiogroup" aria-label="Open notebooks in">
        <button type="button" data-open-mode="read" role="radio">Read only</button>
        <button type="button" data-open-mode="edit" role="radio">Edit mode</button>
      </div>
    </div>
    <label class="toggle-row">
      <span>
        <strong>Draw with finger</strong>
        <small>Off: only Apple Pencil writes, fingers scroll. On: fingers write too.</small>
      </span>
      <input id="finger-toggle" type="checkbox" role="switch">
    </label>
    <div class="settings-info">
      <div id="settings-storage"></div>
      <div id="settings-version"></div>
    </div>
    <div class="actions">
      <button type="button" class="btn btn-primary" data-close>Done</button>
    </div>
  </dialog>

  <!-- Trash -->
  <dialog id="trash-dialog" class="sheet">
    <h2>Trash</h2>
    <p class="sheet-text">Items here are deleted for good after 30 days.</p>
    <ul id="trash-list" class="trash-list"></ul>
    <div class="actions">
      <button type="button" class="btn btn-danger" id="empty-trash-btn">Empty Trash</button>
      <button type="button" class="btn btn-primary" data-close>Done</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
