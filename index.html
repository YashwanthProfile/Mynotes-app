<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>MyNotes</title>
  <meta name="description" content="A free, open source handwriting notes app.">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1b1d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MyNotes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Library -->
  <section id="library-view" class="view">
    <header class="topbar">
      <h1 class="brand">MyNotes</h1>
      <button id="new-notebook-btn" class="btn btn-primary" type="button">
        <span aria-hidden="true">＋</span> New notebook
      </button>
    </header>
    <main class="library">
      <div id="empty-state" class="empty" hidden>
        <div class="empty-icon" aria-hidden="true"></div>
        <h2>No notebooks yet</h2>
        <p>Create your first notebook to start writing.</p>
        <button id="empty-create-btn" class="btn btn-primary" type="button">Create a notebook</button>
      </div>
      <ul id="notebook-grid" class="grid" aria-label="Notebooks"></ul>
    </main>
    <footer class="statusbar">
      <span id="storage-status"></span>
      <span id="version-label"></span>
    </footer>
  </section>

  <!-- Notebook (writing comes in the next step) -->
  <section id="notebook-view" class="view" hidden>
    <header class="topbar">
      <button id="back-btn" class="btn btn-ghost" type="button" aria-label="Back to library">‹ Library</button>
      <h1 id="notebook-title" class="topbar-title"></h1>
      <span class="topbar-spacer"></span>
    </header>
    <main class="canvas-area">
      <div id="page-preview" class="page"></div>
      <p class="hint">Writing with Apple Pencil arrives in the next update.</p>
    </main>
  </section>

  <!-- Create / edit notebook -->
  <dialog id="notebook-dialog" class="sheet">
    <form id="notebook-form" method="dialog">
      <h2 id="notebook-dialog-title">New notebook</h2>
      <label class="field">
        <span>Name</span>
        <input id="nb-title" name="title" type="text" maxlength="80" placeholder="Untitled" autocomplete="off">
      </label>
      <fieldset class="field">
        <legend>Cover</legend>
        <div id="cover-options" class="swatches"></div>
      </fieldset>
      <fieldset class="field" id="paper-fieldset">
        <legend>Paper</legend>
        <div id="paper-options" class="papers"></div>
      </fieldset>
      <div class="actions">
        <button type="button" class="btn btn-ghost" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary" id="nb-submit">Create</button>
      </div>
    </form>
  </dialog>

  <!-- Notebook actions -->
  <dialog id="actions-dialog" class="sheet sheet-small">
    <h2 id="actions-title"></h2>
    <div class="action-list">
      <button type="button" class="btn btn-block" id="action-edit">Rename or change cover</button>
      <button type="button" class="btn btn-block btn-danger" id="action-delete">Delete notebook</button>
      <button type="button" class="btn btn-block btn-ghost" data-close>Cancel</button>
    </div>
  </dialog>

  <!-- Confirm -->
  <dialog id="confirm-dialog" class="sheet sheet-small">
    <h2 id="confirm-title"></h2>
    <p id="confirm-text"></p>
    <div class="actions">
      <button type="button" class="btn btn-ghost" data-close>Cancel</button>
      <button type="button" class="btn btn-danger" id="confirm-ok">Delete</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
